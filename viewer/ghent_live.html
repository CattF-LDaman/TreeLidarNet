<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TreeLidarNet — Ghent live infer</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    body { margin: 0; background: #0d1117; color: #e6edf3; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    .panel {
      position: absolute; z-index: 2; top: 1rem; left: 1rem;
      background: rgba(13,17,23,0.92); padding: 1rem 1.1rem; border-radius: 0.5rem;
      border: 1px solid rgba(255,255,255,0.12); max-width: 24rem; font-size: 0.8rem;
    }
    h1 { font-size: 1rem; margin: 0 0 0.5rem; color: #e6edf3; }
    label { display: flex; align-items: center; gap: 0.5rem; margin: 0.35rem 0; cursor: pointer; }
    .legend { margin: 0.6rem 0; padding: 0.6rem 0; border-top: 1px solid #30363d; border-bottom: 1px solid #30363d; }
    .legend-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.35rem 0; color: #c9d1d9; }
    .swatch-filled { width: 14px; height: 14px; border-radius: 50%; background: #34d399; border: 1px solid #a7f3d0; }
    .swatch-ring { width: 14px; height: 14px; border-radius: 50%; border: 3px solid #fbbf24; background: transparent; box-sizing: border-box; }
    #stats { margin-top: 0.5rem; color: #8b949e; font-size: 0.75rem; line-height: 1.45; }
    .bar { height: 6px; background: #21262d; border-radius: 3px; margin-top: 8px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: #8957e5; width: 0%; transition: width 0.3s; }
    #tip {
      display: none; position: absolute; z-index: 3; pointer-events: none;
      background: rgba(13,17,23,0.95); border: 1px solid #30363d; padding: 0.5rem 0.65rem;
      border-radius: 6px; font-size: 0.75rem; max-width: 240px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="tip"></div>
  <div class="panel">
    <h1>Ghent · LiDAR vs register</h1>
    <div class="legend">
      <div class="legend-row"><span class="swatch-filled"></span> <strong>Register tree</strong> — Stad Gent inventory (ground truth)</div>
      <div class="legend-row"><span class="swatch-ring"></span> <strong>Model guess</strong> — neural net on DHMV II chips</div>
      <div style="color:#8b949e;font-size:0.72rem;margin-top:0.35rem">Ring on top of green = match. Ring alone ≈ discovery or offset.</div>
    </div>
    <label><input type="checkbox" id="show-gt" checked> Show register (green)</label>
    <label><input type="checkbox" id="show-pred" checked> Show model (amber rings)</label>
    <div class="bar"><i id="prog"></i></div>
    <div id="stats">Waiting for status.json…</div>
  </div>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@9.2.7/dist.min.js"></script>
  <script src="map_layers.js"></script>
  <script src="ghent_live_map.js"></script>
</body>
</html>
