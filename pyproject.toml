[project]
name = "treelidarnet"
version = "0.1.0"
description = "Detect urban trees from DHMV II LiDAR using Gent open data (PyTorch)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "orjson>=3.9",
    "pyproj>=3.6",
    "shapely>=2.0",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "laspy>=2.5",
    "lazrs>=0.5",
    "rasterio>=1.3",
    "tensorboard>=2.14",
]

[project.scripts]
treelidarnet = "treelidarnet.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["treelidarnet*"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
