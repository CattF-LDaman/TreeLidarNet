# Canopy v2: find trees in Ghent broadly (soft register + unknown mask).
task: ghent_canopy_detection
run_name: gent_canopy_v2
chip_glob: "*.npz"
# After data-build-gent-grid, set chips_index to limit train/infer to grid manifest:
# chips_index: data/manifests/chips_index_full.parquet
init_checkpoint: runs/gent_real_v1/best.pt
in_channels: 4
base_channels: 32
batch_size: 4
num_workers: 4
pin_memory: true
prefetch_factor: 2
epochs: 10
lr: 0.0003
checkpoint_every_steps: 500

# Fine-tune from register v1: uv run treelidarnet train --config configs/gent_canopy_v2.yaml --resume
# (loads runs/gent_canopy_v2/latest.pt if present; copy gent_real_v1/best.pt meta optional)

loss:
  alpha: 2.0
  neg_beta: 1.0
  neg_beta_hard: 4.0
unknown_band_m: 12.0

grb:
  dir: data/raw/grb
  road_buffer_m: 2.0

paths:
  dsm: null
  dtm: null
  trees_parquet: data/manifests/gent_trees.parquet
