# One epoch from epoch-3 weights: lighter anti-carpet penalty (see plan).
task: ghent_canopy_detection
run_name: gent_canopy_v2
chip_glob: "*.npz"
chips_index: data/manifests/chips_index_full.parquet
init_checkpoint: null
in_channels: 4
base_channels: 32
batch_size: 4
num_workers: 4
pin_memory: true
prefetch_factor: 2
epochs: 10
lr: 0.0003
grad_clip_norm: 5.0
checkpoint_every_steps: 500

sampler:
  tree_chip_weight: 15.0

resume_weights_only: false
resume_from: latest
resume_epochs: 1
reset_best_loss: true
archive_best_to: archive/epoch3_hot/best.pt
clear_stored_ignore: true

loss:
  alpha: 2.0
  neg_beta: 1.0
  neg_beta_hard: 4.0
  per_tree_weight: 0.01
  per_tree_radius_m: 2.0
  unknown_peak_weight: 0.01
  unknown_peak_keep: 0.88
  unknown_peak_floor: 0.45
  unknown_peak_radius_m: 2.0
  unknown_peak_focal: true
  unknown_peak_alpha: 2.0

unknown_band_m: 5.0

grb:
  dir: data/raw/grb
  road_buffer_m: 2.0

paths:
  dsm: null
  dtm: null
  trees_parquet: data/manifests/gent_trees.parquet
